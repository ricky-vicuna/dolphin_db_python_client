[project]
name = "dolphin-db-python-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dolphindb>=3.0.6.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
]

[project.scripts]
dolphin-db-python-client = "dolphin_db_python_client:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]
